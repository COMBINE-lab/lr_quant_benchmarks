# tools 
# path to oarfish (>= v0.9.0)
oarfish: "../../software/oarfish/target/release/oarfish"
# path to kallisto (>= v0.51.1)
kallisto: "../../software/kallisto/kallisto"
# path to bustools (>= v0.44.1)
bustools: "../../software/bustools/bustools"
# path to NanoCount (>= v1.1.0.post2)
nanocount: "NanoCount"
# path to minimap2 (>= 2.28-r1209)
minimap2: "minimap2"
# path to samtools (>= v1.21)
samtools: "samtools"

#number of threads 
threads: 32

# where scripts live
script_dir: "../../scripts/"

# top level to input
path_dir: "../../input/IsoQuant/"
# where read sets ilve
data_dir: "../../input/IsoQuant/datatset/mouse/"
# where references live
ref_dir: "../../input/IsoQuant/reference/mouse/"

# top level to results
result_dir: "../../results/IsoQuant/"
# where alignments go
alignment_dir: "../../results/IsoQuant/alignment/"
# where indices will be written
index_dir: "../../results/IsoQuant/indexes/"

transcriptome: "txps_assembled.fa"
gtf_file: "lrgasp_gencode_vM27_sirvs.gtf"
junc_bed: "lrgasp_gencode_vM27_sirvs_junc.bed"
genome_file: "lrgasp_grcm39_sirvs.fasta"

data:
    ONT: "Mouse.ONT.R10.4.simulated.shuffled.fastq.gz"
    PacBio: "Mouse.PB.simulated.shuffled.fastq.gz"
